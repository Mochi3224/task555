<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apex Arena 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#10131a;--panel:#1a2030;--red:#ff4d3d;--steel:#8fa3b8;--ice:#e8f1f8;--sh:#4cc3ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ice);font-family:"Rajdhani","Noto Sans JP",system-ui,sans-serif;overflow:hidden;font-size:18px}
canvas{display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(12,15,22,.92);z-index:10;text-align:center;padding:20px}
.hide{display:none!important}
h1{font-size:clamp(40px,8vw,84px);margin:0;font-weight:700;line-height:1;letter-spacing:-1px;transform:skewX(-8deg)}
h1 b{color:var(--red)}
p{margin:0;color:var(--steel)}
button{font:inherit;font-weight:700;background:var(--red);color:#fff;border:0;padding:12px 30px;cursor:pointer;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
button:hover,button:focus-visible{background:#ff7060;outline:none}
button.alt{background:var(--panel);color:var(--ice)}
button.sel{background:var(--ice);color:var(--bg)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.card{background:var(--panel);padding:14px 20px;min-width:260px;border-left:4px solid var(--red);text-align:left}
.card ol{margin:6px 0 0;padding-left:22px;color:var(--steel)}
#user{display:flex;align-items:center;gap:10px}
#user img{width:40px;height:40px;border-radius:50%}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:2px solid #fff;border-radius:50%;opacity:.8}
#cross.hit{border-color:var(--red);transform:scale(1.5)}
#scope{position:absolute;inset:0;opacity:0;background:radial-gradient(circle at center,transparent 35%,rgba(0,0,0,.6) 100%)}
#dot{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:#ff2a2a;box-shadow:0 0 6px 2px rgba(255,40,40,.8);opacity:0}
#bars{position:absolute;left:24px;bottom:24px;width:280px}
.bar{height:12px;background:rgba(0,0,0,.5);margin-top:6px;transform:skewX(-20deg)}
.bar i{display:block;height:100%;width:100%}
#hp i{background:#5be37d}#sh i{background:var(--sh)}
#ammo{position:absolute;right:28px;bottom:24px;font-size:56px;font-weight:700;text-align:right;line-height:1}
#ammo small{display:block;font-size:18px;color:var(--steel);font-weight:500}
#top{position:absolute;top:18px;left:0;right:0;text-align:center;font-size:24px;font-weight:700}
#abil{position:absolute;left:24px;bottom:96px;font-size:18px;color:var(--steel)}
#banner{position:absolute;top:22%;left:0;right:0;text-align:center;font-size:44px;font-weight:700;opacity:0;transition:opacity .4s}
#flash{position:absolute;inset:0;box-shadow:inset 0 0 160px rgba(255,40,30,.9);opacity:0;transition:opacity .25s}
@media(prefers-reduced-motion:reduce){#banner,#flash,#cross{transition:none}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>

<div id="login" class="ov">
  <h1>APEX <b>ARENA</b></h1>
  <p>3Dアリーナで敵部隊を倒し続けよう。戦績はアカウントに保存されます。</p>
  <button id="btnLogin">Googleでログイン</button>
  <p id="loginErr"></p>
</div>

<div id="menu" class="ov hide">
  <div id="user"><img id="uImg" alt=""><div style="text-align:left"><b id="uName"></b><p id="uStat"></p></div></div>
  <p>レジェンドを選択</p>
  <div class="row" id="legends"></div>
  <p id="legDesc"></p>
  <div class="row"><button id="btnStart">出撃</button><button id="btnOut" class="alt">ログアウト</button></div>
  <div class="card"><b>ランキング(最多キル)</b><ol id="board"></ol></div>
  <p>WASD 移動(Wで徐々に加速) / Shift しゃがみ・スライディング(滑り中もジャンプ可) / Space ジャンプ・空中でマウスを回しながらA/Dでストレイフ / 壁の前でW+Spaceで壁登り→登り中にSpaceでブースト / 左クリック 射撃 / 右クリック スコープ / R リロード / Q アビリティ</p>
</div>

<div id="pause" class="ov hide"><h1>PAUSE</h1><p>クリックして再開</p></div>

<div id="over" class="ov hide">
  <h1>DOWNED</h1>
  <p id="result"></p>
  <p id="saveMsg"></p>
  <button id="btnBack">メニューへ戻る</button>
</div>

<div id="hud" class="hide">
  <div id="top"><span id="wave"></span> ・ <span id="kills"></span></div>
  <div id="scope"></div><div id="dot"></div><div id="cross"></div>
  <div id="banner"></div>
  <div id="abil"></div>
  <div id="bars"><div class="bar" id="sh"><i></i></div><div class="bar" id="hp"><i></i></div></div>
  <div id="ammo"><span id="am">30</span><small id="reload"></small></div>
  <div id="flash"></div>
</div>

<script type="module">

const firebaseConfig={
  apiKey:"AIzaSyDqkUSfY2goeCeFaCx3Z_1ZJU-NfnZMYPQ",
  authDomain:"task111-9b8f8.firebaseapp.com",
  projectId:"task111-9b8f8",
  storageBucket:"task111-9b8f8.firebasestorage.app",
  messagingSenderId:"194272968746",
  appId:"1:194272968746:web:5ba2bf82290b9ba2838353"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const show=(id,v)=>$(id).classList.toggle('hide',!v);

/* ---------- 認証・保存 ---------- */
let user=null,profile={};
$('btnLogin').onclick=async()=>{
  $('loginErr').textContent='';
  try{await signInWithPopup(auth,new GoogleAuthProvider());}
  catch(e){$('loginErr').textContent='ログインに失敗しました: '+(e.code||e.message);}
};
$('btnOut').onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{
  user=u;
  if(!u){show('login',1);show('menu',0);return;}
  show('login',0);show('menu',1);
  $('uName').textContent=u.displayName||'Player';
  $('uImg').src=u.photoURL||'';
  await loadProfile();loadBoard();
});
async function loadProfile(){
  try{const s=await getDoc(doc(db,'players',user.uid));profile=s.exists()?s.data():{};}catch(e){profile={};}
  $('uStat').textContent=`出撃 ${profile.games||0}回 / 総キル ${profile.totalKills||0} / 最高ウェーブ ${profile.bestWave||0}`;
}
async function loadBoard(){
  const ol=$('board');ol.replaceChildren();
  try{
    const qs=await getDocs(query(collection(db,'players'),orderBy('bestKills','desc'),limit(5)));
    qs.forEach(d=>{const x=d.data(),li=document.createElement('li');li.textContent=`${x.name||'Player'}  ${x.bestKills||0}キル`;ol.appendChild(li);});
    if(!ol.children.length){const li=document.createElement('li');li.textContent='まだ記録がありません';ol.appendChild(li);}
  }catch(e){const li=document.createElement('li');li.textContent='ランキングを読み込めません(Firestoreのルールを確認)';ol.appendChild(li);}
}
async function saveResult(kills,wave){
  $('saveMsg').textContent='保存中…';
  try{
    const ref=doc(db,'players',user.uid),s=await getDoc(ref),o=s.exists()?s.data():{};
    const data={name:user.displayName||'Player',photo:user.photoURL||'',
      bestKills:Math.max(o.bestKills||0,kills),bestWave:Math.max(o.bestWave||0,wave),
      totalKills:(o.totalKills||0)+kills,games:(o.games||0)+1,legend:G.legend,updatedAt:serverTimestamp()};
    await setDoc(ref,data);
    $('saveMsg').textContent='戦績を保存しました';
  }catch(e){$('saveMsg').textContent='保存に失敗しました: '+(e.code||e.message);}
}

/* ---------- レジェンド ---------- */
const LEG={
  wraith:{n:'レイス',d:'Q: 前方へ瞬間ダッシュ(CT 6秒)',cd:6},
  lifeline:{n:'ライフライン',d:'Q: 体力を40回復(CT 14秒)',cd:14},
  octane:{n:'オクタン',d:'Q: 4秒間 移動速度1.5倍(CT 10秒)',cd:10}
};
let pick='wraith';
function drawLegends(){
  const box=$('legends');box.replaceChildren();
  for(const k in LEG){const b=document.createElement('button');b.textContent=LEG[k].n;b.className=k===pick?'sel':'alt';
    b.onclick=()=>{pick=k;drawLegends();};box.appendChild(b);}
  $('legDesc').textContent=LEG[pick].d;
}
drawLegends();

/* ---------- 3Dシーン ---------- */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9cc3e6);scene.fog=new THREE.Fog(0x9cc3e6,35,130);
const cam=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,200);
cam.rotation.order='YXZ';scene.add(cam);
const ren=new THREE.WebGLRenderer({antialias:true});
ren.setSize(innerWidth,innerHeight);ren.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(ren.domElement);
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight);});
scene.add(new THREE.HemisphereLight(0xffffff,0x44505e,1.1));
const sun=new THREE.DirectionalLight(0xffffff,1.3);sun.position.set(30,60,20);scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshLambertMaterial({color:0x3a463c}));
floor.rotation.x=-Math.PI/2;scene.add(floor);
scene.add(new THREE.GridHelper(100,50,0x55665a,0x4a5a4e));

const boxes=[];
const wallMats=[0x6b7280,0x8a6d4b,0x4b5d7a].map(c=>new THREE.MeshLambertMaterial({color:c}));
function addBox(x,z,w,h,d){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),wallMats[boxes.length%3]);
  m.position.set(x,h/2,z);scene.add(m);m.updateMatrixWorld();
  boxes.push({m,b:new THREE.Box3().setFromObject(m)});
}
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
for(let i=0;i<44;i++){const x=(rnd()-.5)*88,z=(rnd()-.5)*88;if(Math.hypot(x,z)<9)continue;addBox(x,z,2+rnd()*6,1+rnd()*4,2+rnd()*6);}
addBox(0,-51,104,8,2);addBox(0,51,104,8,2);addBox(-51,0,2,8,104);addBox(51,0,2,8,104);

const gun=new THREE.Group();
const MT=(c,m=.6,r=.45)=>new THREE.MeshStandardMaterial({color:c,metalness:m,roughness:r});
const dark=MT(0x1f2329),mid=MT(0x3a404a),poly=MT(0x15171b,.1,.8);
const B=(w,h,d)=>new THREE.BoxGeometry(w,h,d);
const cyl=(r,l)=>{const g=new THREE.CylinderGeometry(r,r,l,12);g.rotateX(Math.PI/2);return g;};
const part=(geo,mat,x,y,z,rx=0)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.rotation.x=rx;gun.add(m);return m;};
part(B(.06,.09,.34),dark,0,0,0);            // レシーバー
part(B(.05,.015,.3),mid,0,.0525,0);         // トップカバー
part(B(.055,.07,.2),mid,0,0,-.27);          // ハンドガード
part(cyl(.011,.3),dark,0,.02,-.32);         // バレル
part(cyl(.016,.05),dark,0,.02,-.465);       // マズルブレーキ
part(B(.02,.008,.2),dark,0,.039,-.27);      // レール
part(B(.006,.03,.006),dark,0,.055,-.34);    // フロントサイト
const mag=part(B(.04,.14,.07),poly,0,-.11,-.04,.12);  // マガジン
part(B(.035,.09,.045),poly,0,-.085,.1,-.3); // グリップ
part(B(.045,.08,.2),poly,0,-.005,.27);      // ストック
part(B(.045,.012,.07),dark,0,.066,.04);     // ドットサイト土台
part(B(.006,.045,.03),dark,-.021,.0945,.04);
part(B(.006,.045,.03),dark,.021,.0945,.04);
part(B(.048,.008,.03),dark,0,.1175,.04);
part(new THREE.PlaneGeometry(.036,.04),new THREE.MeshBasicMaterial({color:0x66aaff,transparent:true,opacity:.12,side:THREE.DoubleSide}),0,.0945,.04);
const flash=part(new THREE.SphereGeometry(.035,8,6),new THREE.MeshBasicMaterial({color:0xffc060}),0,.02,-.5);flash.visible=false;
const glove=MT(0x23272d,.1,.85),sleeve=MT(0x3e4a3a,0,.95);
part(B(.05,.05,.08),glove,.012,-.07,.1);               // 右手
part(B(.055,.055,.3),sleeve,.03,-.12,.27,.35);         // 右腕
const lh=new THREE.Group();gun.add(lh);                // 左手(リロードで動く)
const lp=(g,m,x,y,z,rx,ry)=>{const q=new THREE.Mesh(g,m);q.position.set(x,y,z);q.rotation.set(rx,ry,0);lh.add(q);};
lp(B(.055,.05,.1),glove,0,-.05,-.28,0,0);
lp(B(.055,.055,.4),sleeve,-.07,-.09,-.06,-.1,-.35);
part(B(.02,.025,.05),dark,.032,.02,-.02);              // 排莢口
part(B(.012,.02,.05),dark,0,.07,.18);                  // チャージングハンドル
for(let i=0;i<4;i++)part(B(.058,.012,.02),dark,0,.012,-.2-i*.04); // ハンドガードのスリット
part(cyl(.006,.12),dark,0,.02,-.52);                   // 消炎器
gun.position.set(.22,-.2,-.5);cam.add(gun);
const arms=new THREE.Group();cam.add(arms);arms.visible=false;   // 壁登り用の腕
for(const sx of[-1,1]){const a=new THREE.Mesh(B(.07,.07,.5),sleeve);a.position.set(sx*.2,0,-.1);a.rotation.x=.5;arms.add(a);const h=new THREE.Mesh(B(.09,.06,.12),glove);h.position.set(sx*.2,.12,-.34);arms.add(h);}

function collide(p,r,feet){
  let g=0;
  for(const {b} of boxes){
    if(p.x>b.min.x-r&&p.x<b.max.x+r&&p.z>b.min.z-r&&p.z<b.max.z+r){
      if(b.max.y<=feet+.6)g=Math.max(g,b.max.y);
      else if(feet<b.max.y){
        const a=b.max.x+r-p.x,c=p.x-(b.min.x-r),d=b.max.z+r-p.z,e=p.z-(b.min.z-r),m=Math.min(a,c,d,e);
        if(m===a)p.x=b.max.x+r;else if(m===c)p.x=b.min.x-r;else if(m===d)p.z=b.max.z+r;else p.z=b.min.z-r;
      }
    }
  }
  return g;
}

/* ---------- ゲーム状態 ---------- */
const G={running:false,over:false,legend:'wraith'};
const P={pos:new THREE.Vector3(),vy:0,ground:true,yaw:0,pitch:0,hp:100,sh:50,ammo:30,reload:0,fireT:0,cd:0,dash:0,boost:0,kills:0,wave:0,kick:0,eye:1.7,adsT:0,slide:0,sdx:0,sdz:-1,lx:0,lz:-1,flashT:0,vx:0,vz:0,sj:false,climbT:0,jp:false,ramp:0,dip:0,roll:0,sw:0};
let bullets=[],enemies=[],tracers=[],keys={},fire=false,adsHeld=false,locked=false,waveWait=0;
const rc=new THREE.Raycaster();
const eMatBody=new THREE.MeshLambertMaterial({color:0xc0392b}),eMatHead=new THREE.MeshLambertMaterial({color:0xf0c8a0}),eMatLeg=new THREE.MeshLambertMaterial({color:0x2c3e50});

function tex(draw){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');draw(x);const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;return new THREE.MeshLambertMaterial({map:t});}
const noise=(x,c,n)=>{x.fillStyle=c;x.fillRect(0,0,64,64);for(let i=0;i<n;i++){x.fillStyle=`rgba(0,0,0,${Math.random()*.25})`;x.fillRect(Math.random()*64,Math.random()*64,3,3);}};
const mVest=tex(x=>{noise(x,'#3b4a3a',160);x.fillStyle='#22282a';x.fillRect(6,10,52,30);x.fillStyle='#ff6a3d';x.fillRect(0,46,64,5);x.fillStyle='#14181a';for(let i=0;i<3;i++)x.fillRect(10+i*16,16,12,14);});
const mPants=tex(x=>{noise(x,'#2d3340',160);x.fillStyle='#1b1f27';x.fillRect(8,24,18,16);});
const mSleeve=tex(x=>{noise(x,'#3b4a3a',120);x.fillStyle='#ff6a3d';x.fillRect(0,0,64,6);});
const mSkin=tex(x=>noise(x,'#c99b78',40)),mHair=tex(x=>noise(x,'#2a2018',60)),mHelm=tex(x=>noise(x,'#1c2024',80));
const mFace=tex(x=>{noise(x,'#c99b78',40);x.fillStyle='#fff';x.fillRect(14,24,12,7);x.fillRect(38,24,12,7);x.fillStyle='#222';x.fillRect(19,25,5,6);x.fillRect(43,25,5,6);x.fillStyle='#7a3b30';x.fillRect(24,46,16,4);x.fillStyle='#3a2a20';x.fillRect(12,18,16,3);x.fillRect(36,18,16,3);});
const bulletGeo=(()=>{const g=new THREE.CylinderGeometry(.045,.045,1.2,6);g.rotateX(Math.PI/2);return g;})(),bulletMat=new THREE.MeshBasicMaterial({color:0xff4a2a,fog:false});
function spawnEnemy(){
  const g=new THREE.Group(),b=new THREE.Group(),e={g,b,hp:100,cd:1+Math.random()*1.5,side:1,sT:0,jT:2+Math.random()*3,slide:0,vx:0,vz:0,vy:0,ground:true,meshes:[]};
  g.add(b);
  const add=(geo,mat,x,y,z,head,par)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.userData={enemy:e,head:!!head};(par||b).add(m);e.meshes.push(m);return m;};
  add(B(.52,.62,.3),mVest,0,1.2,0);
  add(B(.3,.3,.3),[mSkin,mSkin,mHair,mSkin,mFace,mSkin],0,1.68,0,true);
  add(B(.34,.12,.34),mHelm,0,1.87,0,true);
  e.legs=[-1,1].map(sd=>{const q=new THREE.Group();q.position.set(sd*.13,.82,0);b.add(q);add(B(.2,.82,.22),mPants,0,-.41,0,false,q);return q;});
  add(B(.16,.5,.18),mSleeve,-.3,1.3,.2).rotation.x=-1.2;
  add(B(.16,.5,.18),mSleeve,.3,1.3,.2).rotation.x=-1.2;
  add(B(.07,.08,.6),mHelm,.12,1.28,.45);
  const mk=new THREE.Mesh(new THREE.ConeGeometry(.16,.3,4),new THREE.MeshBasicMaterial({color:0xff3b2e}));mk.rotation.x=Math.PI;mk.position.y=2.4;g.add(mk);
  const a=Math.random()*Math.PI*2,r=34+Math.random()*8;
  g.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
  scene.add(g);enemies.push(e);
}
function nextWave(){
  P.wave++;P.sh=Math.min(50,P.sh+30);P.hp=Math.min(100,P.hp+20);
  for(let i=0;i<2+P.wave;i++)spawnEnemy();
  banner(`ウェーブ ${P.wave}`);
}
function banner(t){const b=$('banner');b.textContent=t;b.style.opacity=1;setTimeout(()=>b.style.opacity=0,1600);}

function startGame(){
  G.legend=pick;G.running=true;G.over=false;
  Object.assign(P,{vy:0,ground:true,yaw:0,pitch:0,hp:100,sh:50,ammo:30,reload:0,fireT:0,cd:0,dash:0,boost:0,kills:0,wave:0,kick:0,eye:1.7,adsT:0,slide:0,sdx:0,sdz:-1,lx:0,lz:-1,flashT:0,vx:0,vz:0,sj:false,climbT:0,jp:false,ramp:0,dip:0,roll:0,sw:0});
  P.pos.set(0,0,0);
  enemies.forEach(e=>scene.remove(e.g));enemies=[];bullets.forEach(q=>scene.remove(q.m));bullets=[];adsHeld=false;fire=false;
  show('menu',0);show('over',0);show('hud',1);show('pause',0);
  nextWave();
  ren.domElement.requestPointerLock();
}
$('btnStart').onclick=startGame;
$('pause').onclick=()=>ren.domElement.requestPointerLock();
$('btnBack').onclick=async()=>{show('over',0);show('menu',1);await loadProfile();loadBoard();};

document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===ren.domElement;
  if(G.running&&!G.over)show('pause',!locked);
});
addEventListener('mousemove',e=>{
  if(!locked)return;
  const k=.0022*(1-.5*P.adsT);P.sw=Math.max(-.08,Math.min(.08,P.sw+e.movementX*.0006));P.yaw-=e.movementX*k;P.pitch=Math.max(-1.45,Math.min(1.45,P.pitch-e.movementY*k));
});
addEventListener('mousedown',e=>{if(e.button===0)fire=true;if(e.button===2)adsHeld=true;});
addEventListener('mouseup',e=>{if(e.button===0)fire=false;if(e.button===2)adsHeld=false;});
addEventListener('contextmenu',e=>{if(G.running)e.preventDefault();});
addEventListener('keydown',e=>{
  keys[e.code]=1;if(e.code.startsWith('Shift'))keys.Shift=1;
  if(!locked)return;
  if(e.code==='KeyR')reload();
  if(e.code==='KeyQ')ability();
  if(e.code.startsWith('Shift')&&!e.repeat&&P.ground&&P.slide<=0&&(keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD)){P.slide=1.4;const s0=Math.max(15,Math.hypot(P.vx,P.vz));P.vx=P.lx*s0;P.vz=P.lz*s0;}
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)P.jp=true;}
});
addEventListener('keyup',e=>{keys[e.code]=0;if(e.code.startsWith('Shift'))keys.Shift=0;});

function reload(){if(!P.reload&&P.ammo<30)P.reload=1.6;}
function ability(){
  if(P.cd>0)return;P.cd=LEG[G.legend].cd;
  if(G.legend==='wraith')P.dash=.25;
  else if(G.legend==='lifeline')P.hp=Math.min(100,P.hp+40);
  else P.boost=4;
}
function dmgPlayer(n){
  if(G.over)return;
  const a=Math.min(P.sh,n);P.sh-=a;n-=a;P.hp-=n;
  $('flash').style.opacity=1;setTimeout(()=>$('flash').style.opacity=0,120);
  if(P.hp<=0)die();
}
function tracer(a,b,color){
  const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),new THREE.LineBasicMaterial({color}));
  scene.add(l);tracers.push({l,t:.06});
}
const dir=new THREE.Vector3(),org=new THREE.Vector3();
function shoot(){
  P.ammo--;P.fireT=.09;P.kick=.04;P.pitch+=.006;flash.visible=true;P.flashT=.04;
  cam.getWorldDirection(dir);
  const sg=.02*(1-.7*P.adsT);dir.x+=(Math.random()-.5)*sg;dir.y+=(Math.random()-.5)*sg;dir.z+=(Math.random()-.5)*sg;dir.normalize();
  cam.getWorldPosition(org);rc.set(org,dir);rc.far=150;
  const hits=rc.intersectObjects([...boxes.map(o=>o.m),...enemies.flatMap(e=>e.meshes)],false);
  const from=gun.localToWorld(new THREE.Vector3(0,.02,-.5));
  let end=org.clone().addScaledVector(dir,120);
  if(hits.length){
    const h=hits[0];end=h.point;const e=h.object.userData.enemy;
    if(e){
      e.hp-=h.object.userData.head?40:20;
      const c=$('cross');c.classList.add('hit');setTimeout(()=>c.classList.remove('hit'),90);
      if(e.hp<=0){scene.remove(e.g);enemies=enemies.filter(x=>x!==e);P.kills++;}
    }
  }
  tracer(from,end,0xffe27a);
}
async function die(){
  G.over=true;G.running=false;adsHeld=false;fire=false;cam.fov=75;cam.updateProjectionMatrix();
  document.exitPointerLock();show('hud',0);show('pause',0);show('over',1);
  $('result').textContent=`ウェーブ ${P.wave} / キル ${P.kills}`;
  await saveResult(P.kills,P.wave);
}

const fwd=new THREE.Vector3();
function update(dt){
  // 移動
  const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),r=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  const sy=Math.sin(P.yaw),cy=Math.cos(P.yaw);
  let mx=-sy*f+cy*r,mz=-cy*f-sy*r;const l=Math.hypot(mx,mz);if(l>1){mx/=l;mz/=l;}
  if(mx||mz){P.lx=mx;P.lz=mz;}
  const crouch=keys.Shift&&P.slide<=0&&P.ground;
  const vmax=(crouch?3.5:9)*(P.boost>0?1.5:1)*(adsHeld?.65:1);
  P.ramp=(mx||mz)?Math.min(1,P.ramp+dt*2.2):0;          // Wを押し続けると10%から加速
  if(P.climbT<=0&&keys.Space&&f>0)for(const {b} of boxes){   // 壁登り開始判定
    const qx=P.pos.x-sy*.7,qz=P.pos.z-cy*.7;
    if(qx>b.min.x&&qx<b.max.x&&qz>b.min.z&&qz<b.max.z&&b.max.y>P.pos.y+1&&b.max.y<P.pos.y+3.4){P.climbT=.55;P.cy0=P.pos.y;P.ctop=b.max.y;P.jp=false;P.sj=false;P.slide=0;break;}
  }
  if(P.dash>0){P.dash-=dt;P.vx=-sy*22;P.vz=-cy*22;}
  if(P.climbT>0){
    P.climbT-=dt;P.vx=P.vz=0;P.vy=0;
    const t=1-Math.max(0,P.climbT)/.55;
    P.pos.y=P.cy0+(P.ctop-P.cy0)*(t*t*(3-2*t));
    P.pos.x+=-sy*2*dt;P.pos.z+=-cy*2*dt;
    if(P.jp){P.climbT=0;P.vy=9;P.vx=-sy*17;P.vz=-cy*17;P.sj=true;P.ground=false;}   // ブーストジャンプ
    else if(P.climbT<=0)P.pos.y=P.ctop;
  }else{
    if(P.ground){
      if(keys.Space){
        P.vy=8;P.ground=false;
        if(P.slide>0){P.slide=0;P.sj=true;const v=Math.hypot(P.vx,P.vz)||1,k=Math.min(18,v*1.1)/v;P.vx*=k;P.vz*=k;}   // スライドジャンプ
      }else if(P.slide>0){
        P.slide-=dt;const fr=Math.max(0,1-dt*.7);P.vx*=fr;P.vz*=fr;
        if(!keys.Shift||Math.hypot(P.vx,P.vz)<4)P.slide=0;
      }else{const a=Math.min(1,dt*10),tg=vmax*(.1+.9*P.ramp);P.vx+=(mx*tg-P.vx)*a;P.vz+=(mz*tg-P.vz)*a;}
    }else if(mx||mz){   // 空中ストレイフ: 視点を回しながらA/Dで速度の向きが曲がる
      const cur=P.vx*mx+P.vz*mz,add=Math.min(Math.max(0,3-cur),70*dt);
      P.vx+=mx*add;P.vz+=mz*add;
    }
    P.pos.x+=P.vx*dt;P.pos.z+=P.vz*dt;
    P.vy-=22*dt;P.pos.y+=P.vy*dt;
    P.pos.x=Math.max(-48,Math.min(48,P.pos.x));P.pos.z=Math.max(-48,Math.min(48,P.pos.z));
    const px=P.pos.x,pz=P.pos.z,g=collide(P.pos,.4,P.pos.y);
    if(P.pos.x!==px)P.vx=0;if(P.pos.z!==pz)P.vz=0;
    if(P.pos.y<=g){if(!P.ground&&P.vy<-6)P.dip=Math.min(.3,-P.vy*.025);P.pos.y=g;P.vy=0;P.ground=true;P.sj=false;}else P.ground=false;
  }
  P.cd=Math.max(0,P.cd-dt);P.boost=Math.max(0,P.boost-dt);
  // 射撃
  P.fireT-=dt;P.kick=Math.max(0,P.kick-dt*.4);
  if(P.reload>0){P.reload-=dt;if(P.reload<=0){P.reload=0;P.ammo=30;}}
  if(fire&&P.fireT<=0&&!P.reload){if(P.ammo>0)shoot();else reload();}
  // 敵
  const eye=new THREE.Vector3(P.pos.x,P.pos.y+P.eye-.1,P.pos.z);
  for(const e of enemies){
    const p=e.g.position,dx=P.pos.x-p.x,dz=P.pos.z-p.z,d=Math.hypot(dx,dz)||1,spd=Math.min(6,3.5+P.wave*.25);
    e.sT-=dt;if(e.sT<=0){e.sT=.5+Math.random();e.side=-e.side;}          // ストレイフ切替
    if(e.ground){
      e.jT-=dt;
      if(e.slide>0){e.slide-=dt;e.vx*=1-dt*.8;e.vz*=1-dt*.8;}
      else{
        const fw=d>16?1:d<8?-1:0,tx=dx/d*fw-dz/d*e.side*.9,tz=dz/d*fw+dx/d*e.side*.9,a=Math.min(1,dt*8);
        e.vx+=(tx*spd-e.vx)*a;e.vz+=(tz*spd-e.vz)*a;
        if(e.jT<=0&&Math.random()<dt*2){e.jT=2+Math.random()*3;
          if(Math.random()<.5){e.vy=7.5;e.ground=false;e.vx*=1.3;e.vz*=1.3;}            // ジャンプ
          else if(d<26){e.slide=.9;e.vx=tx*13;e.vz=tz*13;}}                               // スライディング
      }
    }
    p.x=Math.max(-48,Math.min(48,p.x+e.vx*dt));p.z=Math.max(-48,Math.min(48,p.z+e.vz*dt));
    e.vy-=22*dt;p.y+=e.vy*dt;
    const ex=p.x,ez=p.z,gg=collide(p,.45,p.y);
    if(p.x!==ex)e.vx=0;if(p.z!==ez)e.vz=0;
    if(p.y<=gg){p.y=gg;e.vy=0;e.ground=true;}else e.ground=false;
    e.g.rotation.y=Math.atan2(dx,dz);
    e.b.rotation.x=e.slide>0?-1.15:0;e.b.position.y=e.slide>0?.35:0;
    const sw=Math.sin(performance.now()/130)*(e.ground&&e.slide<=0?Math.hypot(e.vx,e.vz)/6:0);
    e.legs[0].rotation.x=sw*.8;e.legs[1].rotation.x=-sw*.8;
    e.cd-=dt;
    if(e.cd<=0&&d<45){
      e.cd=1+Math.random()*.8;
      const o=new THREE.Vector3(p.x,p.y+1.35,p.z),t=d/38,v=eye.clone().add(new THREE.Vector3(P.vx*t*.6,0,P.vz*t*.6)).sub(o).normalize();
      rc.set(o,v);rc.far=d;
      if(rc.intersectObjects(boxes.map(b=>b.m),false).length===0){
        v.x+=(Math.random()-.5)*.05;v.y+=(Math.random()-.5)*.05;v.z+=(Math.random()-.5)*.05;v.normalize();
        const m=new THREE.Mesh(bulletGeo,bulletMat);m.position.copy(o);m.lookAt(o.clone().add(v));scene.add(m);
        bullets.push({m,v:v.multiplyScalar(38),t:3});            // 目に見える弾
      }
    }
  }
  for(const q of bullets){
    const bp=q.m.position;bp.addScaledVector(q.v,dt);q.t-=dt;
    if(Math.abs(bp.x-P.pos.x)<.5&&Math.abs(bp.z-P.pos.z)<.5&&bp.y>P.pos.y&&bp.y<P.pos.y+P.eye+.1){q.t=0;dmgPlayer(Math.min(10,5+P.wave*.5));}
    else for(const {b} of boxes)if(bp.x>b.min.x&&bp.x<b.max.x&&bp.y>b.min.y&&bp.y<b.max.y&&bp.z>b.min.z&&bp.z<b.max.z){q.t=0;break;}
  }
  bullets=bullets.filter(q=>{if(q.t<=0){scene.remove(q.m);return false;}return true;});
  if(!enemies.length&&!G.over){waveWait+=dt;if(waveWait>2.5){waveWait=0;nextWave();}}
  // カメラ
  P.eye+=(((P.slide>0||P.sj)?.8:crouch?1.1:1.7)-P.eye)*Math.min(1,dt*14);
  P.dip*=Math.max(0,1-dt*8);
  const spd2=Math.hypot(P.vx,P.vz),hb=P.ground&&P.slide<=0?Math.sin(performance.now()/105)*.025*Math.min(1,spd2/9):0;
  cam.position.set(P.pos.x,P.pos.y+P.eye-P.dip+hb,P.pos.z);
  P.roll+=((-r*.035+((P.slide>0||P.sj)?.07:0))-P.roll)*Math.min(1,dt*8);
  cam.rotation.set(P.pitch,P.yaw,P.roll);
  P.adsT+=(((adsHeld&&!P.reload&&P.climbT<=0)?1:0)-P.adsT)*Math.min(1,dt*12);
  cam.fov=75-30*P.adsT+Math.min(8,Math.max(0,spd2-9));cam.updateProjectionMatrix();
  const L=(a,b)=>a+(b-a)*P.adsT,bob=hb*.4*(1-P.adsT);
  const u=P.reload>0?1-P.reload/1.6:0,k1=u<.2?u/.2:u>.8?(1-u)/.2:1;   // リロード進行
  gun.position.set(L(.22,0),L(-.2,-.0945)+bob-.06*k1,L(-.5,-.34)+P.kick*1.5);
  gun.rotation.set(P.kick*2+.4*k1,-P.sw*1.5,-.5*k1);P.sw*=Math.max(0,1-dt*6);
  mag.visible=!(u>.3&&u<.45);mag.position.y=u>.45&&u<.7?-.41+(u-.45)*1.2:u>.2&&u<=.3?-.11-(u-.2)*3:-.11;
  lh.position.set(0,-.09*k1,.24*k1);
  gun.visible=P.climbT<=0;arms.visible=P.climbT>0;
  if(P.climbT>0){const t=1-P.climbT/.55;arms.position.set(0,-.5+.5*t,-.05);}
  P.jp=false;
  if(P.flashT>0){P.flashT-=dt;if(P.flashT<=0)flash.visible=false;}
  $('dot').style.opacity=P.adsT>.85?1:0;$('scope').style.opacity=P.adsT;$('cross').style.visibility=P.adsT>.05?'hidden':'visible';
  // HUD
  $('hp').firstChild.style.width=Math.max(0,P.hp)+'%';
  $('sh').firstChild.style.width=P.sh*2+'%';
  $('am').textContent=P.ammo;
  $('reload').textContent=P.reload?'リロード中…':'30発マガジン';
  $('wave').textContent=`ウェーブ ${P.wave}`;$('kills').textContent=`キル ${P.kills}`;
  $('abil').textContent=`${LEG[G.legend].n}  Q: ${P.cd>0?Math.ceil(P.cd)+'秒':'使用可能'}`;
}

let last=performance.now();
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(G.running&&locked)update(dt);
  for(const x of tracers)x.t-=dt;
  tracers=tracers.filter(x=>{if(x.t<=0){scene.remove(x.l);x.l.geometry.dispose();return false;}return true;});
  ren.render(scene,cam);
}
cam.position.set(0,30,60);cam.lookAt(0,0,0);
requestAnimationFrame(loop);
</script>
